<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Docker-TrueNAS_Backup icon: two stacked storage servers joined by a
       sync arrow, with a power badge for "wakes, copies, sleeps".
       Original artwork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F4E79"/>
      <stop offset="1" stop-color="#0E2236"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7BE0A8"/>
      <stop offset="1" stop-color="#2FAE6B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Primary server (top, lit) -->
  <g filter="url(#shadow)">
    <rect x="96" y="104" width="250" height="104" rx="20" fill="#F4F7FA"/>
    <rect x="120" y="134" width="96" height="14" rx="7" fill="#9FB3C8"/>
    <rect x="120" y="164" width="64" height="14" rx="7" fill="#9FB3C8"/>
    <circle cx="300" cy="140" r="11" fill="#2FAE6B"/>
    <circle cx="300" cy="174" r="11" fill="#2FAE6B"/>
  </g>

  <!-- Backup server (bottom, dimmed: usually off) -->
  <g filter="url(#shadow)">
    <rect x="96" y="300" width="250" height="104" rx="20" fill="#C9D4DF"/>
    <rect x="120" y="330" width="96" height="14" rx="7" fill="#8597AA"/>
    <rect x="120" y="360" width="64" height="14" rx="7" fill="#8597AA"/>
    <circle cx="300" cy="336" r="11" fill="#6B7F94"/>
    <circle cx="300" cy="370" r="11" fill="#6B7F94"/>
  </g>

  <!-- Replication arrow from primary down to backup -->
  <path d="M221 216 V282" stroke="#FFC94D" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M195 270 L221 298 L247 270" stroke="#FFC94D" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Power badge -->
  <g filter="url(#shadow)">
    <circle cx="378" cy="378" r="74" fill="url(#badge)"/>
    <path d="M350 352 A40 40 0 1 0 406 352" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M378 330 V376" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
