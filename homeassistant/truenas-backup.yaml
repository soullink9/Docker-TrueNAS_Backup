# Home Assistant side of the weekly TrueNAS backup (docs/home-assistant.md).
#
# 1. Helper: Settings > Devices & services > Helpers > Create helper > Date and/or time,
#    "Date and time", named "TrueNAS backup last success"
#    (entity id input_datetime.truenas_backup_last_success).
#    Or paste this block into configuration.yaml instead and restart:
#
# input_datetime:
#   truenas_backup_last_success:
#     name: TrueNAS backup last success
#     has_date: true
#     has_time: true
#
# 2. Automations: Settings > Automations & scenes > Create automation > Edit in YAML,
#    paste ONE automation below per new automation, and save.
#
# Replace in both:
#   truenas-backup-CHANGE-ME      -> a long random webhook id (it acts as the password)
#   notify.mobile_app_YOUR_PHONE  -> your phone's notify action (Developer tools > Actions, search "mobile_app")
#
# The webhook URL for HA_WEBHOOK_URL in .env is then:
#   http://<home-assistant-ip>:8123/api/webhook/truenas-backup-CHANGE-ME

# ---------------------------------------------------------------------------
# Automation 1: receive results from the primary TrueNAS
# ---------------------------------------------------------------------------
alias: TrueNAS weekly backup - result
description: Records successful runs and pushes failures and warnings to the phone.
mode: queued
triggers:
  - trigger: webhook
    webhook_id: truenas-backup-CHANGE-ME
    allowed_methods:
      - POST
    local_only: true
actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.json.status == 'success' }}"
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.truenas_backup_last_success
            data:
              timestamp: "{{ now().timestamp() }}"
    default:
      - action: notify.mobile_app_YOUR_PHONE
        data:
          title: "{{ trigger.json.title }}"
          message: "{{ trigger.json.message }}"
          data:
            push:
              interruption-level: time-sensitive   # iOS; ignored on Android
            priority: high                          # Android; ignored on iOS
            ttl: 0

