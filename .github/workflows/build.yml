# GitHub copy of the build (for when the Gitea repo is push-mirrored to GitHub).
# Builds the image, runs the tests inside it, and publishes it to the GitHub
# Container Registry (ghcr.io), the default image in compose.example.yaml.
#
#   image files changed                -> build, push :latest and :sha-<commit>
#   VERSION not yet released on GitHub -> also :<version> and a vX.Y.Z release
#                                         (without image changes, the existing
#                                         :latest is tagged :<version>, no build)
#   only docs, blueprint etc. changed  -> nothing to build
#   pull request, manual run           -> build and test (a PR publishes nothing)
#
# "Image files" are the ones scripts/image-changed.sh lists (app/, tests/,
# Dockerfile, ...).
#
# Catch-up: a mirror push can carry several commits at once, and only the
# newest one runs. Both questions are answered over the whole push: which
# files changed since the previous head, and is VERSION released here yet.
# So a release is never missed, even when the newest commit only touches
# docs. Versions skipped over in between are not released: the current one
# supersedes them.
#
# Needs nothing to be set up: GITHUB_TOKEN can push packages and create
# releases with the permissions below. The first push creates the package as
# private; make it public once under the package's settings on GitHub.
#
# Gitea runs .gitea/workflows/build.yml instead: it ignores .github/workflows
# when .gitea/workflows exists, and the job below also checks it is on GitHub.

name: Build image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write     # create the release
  packages: write     # push to ghcr.io

jobs:
  build:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0    # the whole history, to see what a push changed

      - name: Decide what to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # VERSION is the only place the version is written down.
          version="$(tr -d '[:space:]' < VERSION)"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must look like 1.2.3, found '$version'" >&2
            exit 1
          fi
          # Every version needs a CHANGELOG.md entry; it becomes the release notes.
          scripts/release-notes.sh "$version" > /dev/null

          # Pushes build only when files that go into the image changed.
          # Pull requests and manual runs always build.
          build=true
          if [ "$EVENT" = "push" ] && ! scripts/image-changed.sh "$BEFORE" "$GITHUB_SHA"; then
            build=false
          fi

          # A version not released here yet is released now, whichever
          # commit introduced it.
          new=false
          if [ "$EVENT" != "pull_request" ] && ! gh release view "v$version" >/dev/null 2>&1; then
            new=true
            echo "v$version is not released on GitHub yet: releasing it."
          fi

          {
            echo "version=$version"
            echo "new=$new"
            echo "build=$build"
            echo "image=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
            echo "short_sha=${GITHUB_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Run the tests
        # The Dockerfile's test stage runs the unit tests in the real image.
        if: steps.plan.outputs.build == 'true'
        run: docker build --target test .

      - name: Build the image
        # The source label links the package to this repository on GitHub.
        if: steps.plan.outputs.build == 'true'
        run: >
          docker build
          --build-arg VERSION=${{ steps.plan.outputs.version }}
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --tag ${{ steps.plan.outputs.image }}:latest
          --tag ${{ steps.plan.outputs.image }}:sha-${{ steps.plan.outputs.short_sha }}
          .

      - name: Push the image
        if: (steps.plan.outputs.build == 'true' || steps.plan.outputs.new == 'true') && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          image="${{ steps.plan.outputs.image }}"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          if [ "${{ steps.plan.outputs.build }}" = "true" ]; then
            docker push "$image:latest"
            docker push "$image:sha-${{ steps.plan.outputs.short_sha }}"
          else
            # New version, same image: give the published :latest its version.
            docker pull "$image:latest"
          fi

          # The version tag is pushed once, with the release, so it never
          # changes after people start using it.
          if [ "${{ steps.plan.outputs.new }}" = "true" ]; then
            docker tag "$image:latest" "$image:${{ steps.plan.outputs.version }}"
            docker push "$image:${{ steps.plan.outputs.version }}"
          fi

          docker logout ghcr.io

      - name: Create the release
        if: steps.plan.outputs.new == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.plan.outputs.version }}"

          # The release notes are this version's CHANGELOG.md section.
          notes="$(scripts/release-notes.sh "$version")"

          gh release create "v$version" \
            --target "$GITHUB_SHA" \
            --title "v$version" \
            --notes "$notes

          Image: \`${{ steps.plan.outputs.image }}:$version\`

          See docs/setup.md for how to run it."
